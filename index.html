<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — FC26 Transfer Tracker</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <div class="card-head page-header">
        <div>
          <div class="save-title-row">
            <h1>Dashboard</h1>
          </div>
          <p class="sub">Create, open and delete career mode trackers. Data is saved to AWS (your account).</p>
        </div>
        <div class="actions header-utilities">
          <button id="btn-signout" class="btn btn-secondary" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-head">
        <h2>Career saves</h2>
        <div class="actions">
          <button id="btn-add-save" class="btn btn-primary" type="button">Add new career save</button>
        </div>
      </div>

      <div class="table-wrap">
        <table style="min-width: 640px;">
          <thead>
            <tr>
              <th>Save</th>
              <th>Created</th>
              <th class="num">Players</th>
              <th class="num">Profit</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="save-rows"></tbody>
        </table>
      </div>

      <p class="subtle" id="empty-state" style="display:none; margin-top: 12px;">
        No career saves yet. Click <span class="mono">Add new career save</span> to get started.
      </p>
    </section>

    <footer class="footer">
      <div class="theme-control">
        <span>Appearance</span>
        <button class="btn btn-secondary" type="button" data-theme-toggle aria-pressed="false">Light mode</button>
      </div>
      <p>Tip: your saves are tied to your login, so you can access them on any device.</p>
    </footer>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
