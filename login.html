<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login — FC26 Transfer Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <h1>FC26 Transfer Tracker</h1>
    <p class="muted">Sign in to access your career saves on any device.</p>

    <div class="card">
      <div class="row">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
      </div>

      <div class="row">
        <button id="btn-signin" class="btn btn-primary" type="button">Sign in</button>
        <button id="btn-signup" class="btn btn-secondary" type="button">Create account</button>
      </div>

      <!-- Confirmation block (shown only when needed) -->
      <div id="confirm-block" class="hidden">
        <p class="muted confirmation-copy">
          Enter the verification code sent to your email.
        </p>
        <div class="row">
          <input id="confirm-code" inputmode="numeric" placeholder="Verification code" />
          <button id="btn-confirm" class="btn btn-primary" type="button">Confirm account</button>
          <button id="btn-resend" class="btn btn-secondary" type="button">Resend code</button>
        </div>
      </div>

      <div id="status" class="muted"></div>
      <div id="error" class="error"></div>
      <div id="ok" class="ok"></div>
    </div>
  </div>

  <footer class="footer container theme-footer">
      <div class="theme-control">
        <button class="theme-switch" type="button" role="switch" data-theme-toggle aria-label="Dark mode" aria-checked="true" title="Toggle light and dark mode">
          <span class="theme-switch-thumb" aria-hidden="true"></span>
          <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg>
        </button>
      </div>
  </footer>

  <script type="module" src="./login.js"></script>
</body>
</html>
