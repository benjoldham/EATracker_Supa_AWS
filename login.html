<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login — FC26 Transfer Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <style>
    .login-wrap { max-width: 520px; margin: 64px auto; padding: 0 16px; }
    .login-wrap .row { display: flex; gap: var(--space-form-fields); flex-wrap: wrap; }
    .login-wrap .row > * { flex: 1; min-width: min(180px, 100%); }
    .login-wrap label { margin-bottom: 7px; }
    .login-wrap input { font-size: 16px; }
    .login-wrap .muted { color: var(--muted); }
    .login-wrap .error { color: var(--danger); white-space: pre-wrap; }
    .login-wrap .ok { color: var(--ok); white-space: pre-wrap; }
    .login-wrap #confirm-block { display: flex; flex-direction: column; gap: var(--space-card-items); }
    .login-wrap #status:empty, .login-wrap #error:empty, .login-wrap #ok:empty { display: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <h1>FC26 Transfer Tracker</h1>
    <p class="muted">Sign in to access your career saves on any device.</p>

    <div class="card">
      <div class="row">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
      </div>

      <div class="row">
        <button id="btn-signin" class="btn btn-primary" type="button">Sign in</button>
        <button id="btn-signup" class="btn btn-secondary" type="button">Create account</button>
      </div>

      <!-- Confirmation block (shown only when needed) -->
      <div id="confirm-block" class="hidden">
        <p class="muted" style="margin: 0 0 8px 0;">
          Enter the verification code sent to your email.
        </p>
        <div class="row">
          <input id="confirm-code" inputmode="numeric" placeholder="Verification code" />
          <button id="btn-confirm" class="btn btn-primary" type="button">Confirm account</button>
          <button id="btn-resend" class="btn btn-secondary" type="button">Resend code</button>
        </div>
      </div>

      <div id="status" class="muted"></div>
      <div id="error" class="error"></div>
      <div id="ok" class="ok"></div>
    </div>
  </div>

  <footer class="footer container theme-footer">
      <div class="theme-control">
        <span>Appearance</span>
        <button class="btn btn-secondary" type="button" data-theme-toggle aria-pressed="false">Light mode</button>
      </div>
  </footer>

  <script type="module" src="./login.js"></script>
</body>
</html>
